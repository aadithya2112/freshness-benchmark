services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    container_name: freshness-v2-qdrant
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    ports: ['127.0.0.1:16333:6333']
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.3@sha256:e96e2e04ee6f401a8dcdf89adb80b610516e1491a33769dfed6d1318801e1129
    container_name: freshness-v2-weaviate
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    ports: ['127.0.0.1:18080:8080']
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      ASYNC_INDEXING: 'false'
      DISABLE_TELEMETRY: 'true'
  postgres:
    shm_size: 1g
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: freshness-v2-pgvector
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    ports: ['127.0.0.1:15432:5432']
    environment:
      POSTGRES_DB: freshness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
