[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshness-benchmark"
version = "0.1.0"
description = "MVP benchmark for vector search freshness latency."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Freshness Benchmark" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
