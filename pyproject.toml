[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshness-benchmark"
version = "0.2.0"
description = "Benchmark vector-search freshness across embedding modes and vector backends."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Freshness Benchmark" }]
dependencies = ["psycopg[binary]>=3.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
