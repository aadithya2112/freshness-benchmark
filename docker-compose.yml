services:
  qdrant:
    image: qdrant/qdrant:v1.13.4@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    container_name: freshness-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.29.0@sha256:4d2eceef34882b5e573ee77ef0e92423838583676f1cf0f054c186b36444b132
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    container_name: freshness-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: "20"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"

  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    container_name: freshness-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: freshness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
